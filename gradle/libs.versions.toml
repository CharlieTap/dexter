[versions]

version-name = "0.1.0"

compile-sdk = "37"
min-sdk = "28"

java-compiler-version = "25"
java-library-bytecode-version = "17"
android-library-bytecode-version = "11"
java-plugin-bytecode-version = "17"

android-build-tools-plugin = "9.4.1"
versions-plugin = "0.61.0"

burst = "2.14.0"

dokka="2.2.0"

gradle-maven-publish-plugin = "0.37.0"

kotlin = "2.4.21"
kotlinter = "5.6.0"

[plugins]

burst = { id = "app.cash.burst", version.ref = "burst" }
dokka = { id = "org.jetbrains.dokka", version.ref="dokka" }
gradle-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "gradle-maven-publish-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

conventions-kmp  = { id = "kmp-conventions" }
conventions-kotlin = { id = "kotlin-conventions" }
conventions-linting  = { id = "linting-conventions" }
conventions-publishing  = { id = "publishing-conventions" }
conventions-versions  = { id = "versions-conventions" }

[libraries]

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin"}

android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-build-tools-plugin" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradle-maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "gradle-maven-publish-plugin" }
gradle-versions-plugin = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "versions-plugin" }
kotlinter-gradle-plugin = { module = "org.jmailen.gradle:kotlinter-gradle", version.ref = "kotlinter" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
